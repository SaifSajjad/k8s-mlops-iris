apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Scale serving here (assignment asks 3-5). Change to 5 to demo scaling.
patches:
  - target:
      kind: Deployment
      name: iris-serving
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
