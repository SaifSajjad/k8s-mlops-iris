apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels: { app: mlflow }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mlflow }
  template:
    metadata:
      labels: { app: mlflow }
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.16.2
          command: ["mlflow"]
          args:
            - "server"
            - "--backend-store-uri=sqlite:////mlflow/mlflow.db"
            - "--serve-artifacts"
            - "--artifacts-destination=/mlflow/artifacts"
            - "--host=0.0.0.0"
            - "--port=5000"
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-data
